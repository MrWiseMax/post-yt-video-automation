name: Check Scheduled Videos Live

# Every ~15 minutes: copy publish times down from YouTube, which is the source of
# truth for them, and detect scheduled videos that have gone public.
on:
  # GitHub's own schedule is best-effort and in practice fires every few hours,
  # so it is only a backstop. The real cadence comes from Supabase pg_cron, which
  # fires the repository_dispatch below every 15 minutes.
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    # Fired by the web app when its page loads. Every run does the same full
    # check: sync publish times, reconcile deleted videos, detect go-live.
    types: [check-live, refresh-videos]
  workflow_dispatch:

concurrency:
  group: check-live
  # Queue rather than cancel, so a run is never killed part-way through marking
  # videos posted and sending their Telegram message.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Sync publish times and check for videos that went live
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/check-live.js
