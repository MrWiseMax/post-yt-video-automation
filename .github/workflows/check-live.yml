name: Check Scheduled Videos Live

# Every ~15 minutes: push any reschedule requested in the web app, copy publish
# times down from YouTube, and detect scheduled videos that have gone public.
on:
  schedule:
    - cron: '*/15 * * * *'
  # Fired by Supabase the moment a reschedule is requested in the web app, so
  # the change reaches YouTube in about a minute instead of on the next tick.
  repository_dispatch:
    types: [sync-videos]
  workflow_dispatch:

concurrency:
  group: check-live
  # Queue rather than cancel. A run can be part-way through liking and
  # commenting, and killing it between posting the comment and recording that
  # it posted would make the next run comment a second time.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Sync publish times and check for videos that went live
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/check-live.js
